<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ladder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@300;400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --r:rgba(255,99,102,1);   --r2:rgba(255,99,102,0.15);
  --o:rgba(255,165,60,1);   --o2:rgba(255,165,60,0.15);
  --y:rgba(255,220,50,1);   --y2:rgba(255,220,50,0.15);
  --g:rgba(60,210,120,1);   --g2:rgba(60,210,120,0.15);
  --b:rgba(60,150,255,1);   --b2:rgba(60,150,255,0.15);
  --v:rgba(160,80,255,1);   --v2:rgba(160,80,255,0.15);
  --p:rgba(255,90,180,1);   --p2:rgba(255,90,180,0.15);

  --bg:#0d0d14;--bg2:#13131f;--bg3:#1a1a2e;--bg4:#22223a;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0f0ff;--text2:rgba(240,240,255,0.65);--text3:rgba(240,240,255,0.35);
  --shadow:0 8px 32px rgba(0,0,0,0.6);
  --rr:12px;--rr2:18px;--rr3:26px;

  --grad:linear-gradient(135deg,#ff6366,#ff9c3c,#ffd932,#3cd278,#3c96ff,#a050ff,#ff5ab4);
  --grad2:linear-gradient(90deg,#ff6366,#ff9c3c,#ffd932,#3cd278,#3c96ff,#a050ff,#ff5ab4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Nunito Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* ── RAINBOW SCROLLBAR ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--grad);border-radius:2px;}

/* ── HEADER ── */
header{
  height:54px;flex-shrink:0;
  background:var(--bg2);
  border-bottom:2px solid transparent;
  background-clip:padding-box;
  position:relative;
  display:flex;align-items:center;
  padding:0 16px;gap:8px;
  z-index:10;
}
header::after{
  content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;
  background:var(--grad2);
}
.logo{
  font-family:'Nunito',sans-serif;font-size:1.4rem;font-weight:900;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;cursor:pointer;letter-spacing:0.01em;flex-shrink:0;
  filter:brightness(1.1);
}
.logo sup{font-size:0.5rem;-webkit-text-fill-color:rgba(160,80,255,0.8);vertical-align:super;margin-left:1px;font-family:'DM Mono',monospace;}
.hdr-chapter{font-size:0.7rem;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.hdr-right{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.page-badge{
  font-family:'DM Mono',monospace;font-size:0.62rem;
  background:rgba(255,255,255,0.07);border:1px solid var(--border2);
  padding:3px 9px;border-radius:20px;color:var(--text2);white-space:nowrap;
}
.hbtn{
  height:28px;padding:0 12px;background:rgba(255,255,255,0.06);
  border:1px solid var(--border2);color:var(--text2);
  border-radius:20px;font-family:'DM Mono',monospace;font-size:0.6rem;
  cursor:pointer;transition:all 0.15s;white-space:nowrap;letter-spacing:0.03em;
}
.hbtn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.25);color:var(--text);}
#resume-btn{
  background:linear-gradient(135deg,var(--o),var(--r));
  border:none;color:white;font-weight:700;
  font-family:'Nunito',sans-serif;font-size:0.7rem;
  box-shadow:0 2px 12px rgba(255,130,60,0.4);
}
#resume-btn:hover{filter:brightness(1.1);transform:translateY(-1px);}

main{flex:1;overflow:hidden;position:relative;display:flex;}

/* ── LIBRARY ── */
#library-screen{display:flex;flex-direction:column;width:100%;height:100%;overflow-y:auto;padding:28px 24px 40px;background:var(--bg);}
.lib-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.lib-eyebrow{font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;margin-bottom:6px;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.lib-heading{font-family:'Nunito',sans-serif;font-size:2rem;font-weight:900;color:var(--text);line-height:1;}
.add-btn{
  padding:10px 22px;border:none;color:white;
  background:linear-gradient(135deg,#ff6366,#ff9c3c);
  border-radius:var(--rr);font-family:'Nunito',sans-serif;font-size:0.88rem;
  font-weight:800;cursor:pointer;transition:all 0.2s;white-space:nowrap;
  box-shadow:0 4px 20px rgba(255,100,100,0.35);
}
.add-btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 6px 24px rgba(255,100,100,0.5);}
#pdf-input{display:none;}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}

/* Book cards — each gets a different rainbow gradient */
.book-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--rr2);overflow:hidden;cursor:pointer;
  transition:all 0.22s cubic-bezier(0.34,1.2,0.64,1);
  position:relative;display:flex;flex-direction:column;
}
.book-card:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(0,0,0,0.4);}
.book-spine{height:5px;}
.book-card:nth-child(7n+1) .book-spine{background:linear-gradient(90deg,#ff6366,#ff9c3c);}
.book-card:nth-child(7n+2) .book-spine{background:linear-gradient(90deg,#ff9c3c,#ffd932);}
.book-card:nth-child(7n+3) .book-spine{background:linear-gradient(90deg,#ffd932,#3cd278);}
.book-card:nth-child(7n+4) .book-spine{background:linear-gradient(90deg,#3cd278,#3c96ff);}
.book-card:nth-child(7n+5) .book-spine{background:linear-gradient(90deg,#3c96ff,#a050ff);}
.book-card:nth-child(7n+6) .book-spine{background:linear-gradient(90deg,#a050ff,#ff5ab4);}
.book-card:nth-child(7n+7) .book-spine{background:var(--grad2);}
.book-body{padding:14px 16px 12px;flex:1;display:flex;flex-direction:column;gap:4px;}
.book-title{font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:800;color:var(--text);line-height:1.3;}
.book-file{font-family:'DM Mono',monospace;font-size:0.57rem;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
.book-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.book-tag{font-family:'DM Mono',monospace;font-size:0.56rem;padding:2px 8px;border-radius:20px;font-weight:600;}
.btag-g{background:rgba(255,220,50,0.15);color:#ffd932;}
.btag-n{background:rgba(60,210,120,0.15);color:#3cd278;}
.book-bar-wrap{margin-top:9px;height:3px;background:rgba(255,255,255,0.07);border-radius:2px;}
.book-bar{height:100%;background:var(--grad2);border-radius:2px;}
.book-del{position:absolute;top:12px;right:10px;background:rgba(255,255,255,0.07);border:none;color:var(--text3);font-size:0.68rem;cursor:pointer;padding:3px 8px;border-radius:20px;transition:all 0.12s;}
.book-del:hover{background:#ff6366;color:white;}
.lib-empty{text-align:center;padding:64px 20px;color:var(--text3);}
.lib-empty-icon{font-size:3.5rem;margin-bottom:16px;display:block;opacity:0.3;}
.lib-empty p{font-size:0.9rem;font-style:italic;}

/* ── ANALYZING ── */
#analyzing-screen{display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;width:100%;height:100%;padding:40px;}
.spin{
  width:52px;height:52px;border-radius:50%;
  border:3px solid transparent;
  background:linear-gradient(var(--bg),var(--bg)) padding-box,
             var(--grad) border-box;
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.analyzing-title{font-family:'Nunito',sans-serif;font-size:1.4rem;font-weight:800;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.analyzing-sub{font-size:0.82rem;color:var(--text3);}
#analyzing-progress{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--text2);}
#reselect-btn{
  padding:11px 28px;border:none;color:white;
  background:linear-gradient(135deg,#3c96ff,#a050ff);
  border-radius:var(--rr);font-family:'Nunito',sans-serif;font-size:0.9rem;
  font-weight:800;cursor:pointer;transition:all 0.15s;margin-top:8px;
  box-shadow:0 4px 20px rgba(100,100,255,0.35);
}
#reselect-btn:hover{filter:brightness(1.1);}

/* ── CHAPTER PICKER ── */
#chapter-screen{display:none;width:100%;height:100%;overflow-y:auto;padding:28px 24px 40px;background:var(--bg);}
.ch-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:12px;}
.ch-eyebrow{font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.1em;margin-bottom:5px;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ch-heading{font-family:'Nunito',sans-serif;font-size:1.7rem;font-weight:900;color:var(--text);}
.ch-sub{font-size:0.78rem;color:var(--text3);margin-top:4px;}
.ch-file{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);margin-top:4px;}
.ch-back{padding:7px 14px;background:rgba(255,255,255,0.06);border:1px solid var(--border2);color:var(--text2);border-radius:20px;font-family:'DM Mono',monospace;font-size:0.6rem;cursor:pointer;white-space:nowrap;transition:all 0.12s;flex-shrink:0;}
.ch-back:hover{background:rgba(255,255,255,0.12);color:var(--text);}
.chapters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}

/* Chapter cards — rotating rainbow accents */
.chapter-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rr2);padding:18px 20px;cursor:pointer;transition:all 0.2s cubic-bezier(0.34,1.2,0.64,1);position:relative;overflow:hidden;}
.chapter-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;transform:scaleY(0);transform-origin:bottom;transition:transform 0.2s;}
.chapter-card:nth-child(7n+1)::before{background:linear-gradient(180deg,#ff6366,#ff9c3c);}
.chapter-card:nth-child(7n+2)::before{background:linear-gradient(180deg,#ff9c3c,#ffd932);}
.chapter-card:nth-child(7n+3)::before{background:linear-gradient(180deg,#ffd932,#3cd278);}
.chapter-card:nth-child(7n+4)::before{background:linear-gradient(180deg,#3cd278,#3c96ff);}
.chapter-card:nth-child(7n+5)::before{background:linear-gradient(180deg,#3c96ff,#a050ff);}
.chapter-card:nth-child(7n+6)::before{background:linear-gradient(180deg,#a050ff,#ff5ab4);}
.chapter-card:nth-child(7n+7)::before{background:var(--grad);}
.chapter-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.35);border-color:var(--border2);}
.chapter-card:hover::before{transform:scaleY(1);}
.chapter-card.last-read{border-color:rgba(255,220,50,0.35);background:var(--bg3);}
.cc-num{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--text3);letter-spacing:0.07em;margin-bottom:5px;}
.cc-title{font-family:'Nunito',sans-serif;font-size:0.97rem;font-weight:800;color:var(--text);line-height:1.35;margin-bottom:7px;}
.cc-meta{font-size:0.7rem;color:var(--text3);display:flex;gap:8px;flex-wrap:wrap;}
.cc-tag{font-family:'DM Mono',monospace;font-size:0.56rem;padding:2px 7px;border-radius:20px;font-weight:600;}
.cc-tag-y{background:rgba(255,220,50,0.15);color:#ffd932;}
.cc-tag-g{background:rgba(60,210,120,0.15);color:#3cd278;}
.cc-prog{margin-top:10px;height:3px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
.cc-prog-bar{height:100%;background:var(--grad2);border-radius:2px;}

/* ── READER ── */
#viewer-screen{display:none;width:100%;height:100%;overflow:hidden;background:#0a0a12;position:relative;}
.side-nav{position:absolute;top:0;bottom:0;width:48px;display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer;transition:background 0.15s;user-select:none;}
#nav-prev{left:0;}
#nav-next{right:0;}
.side-nav:hover{background:rgba(255,255,255,0.03);}
.side-arrow{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.07);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.35);font-size:0.95rem;transition:all 0.18s;}
.side-nav:hover .side-arrow{background:linear-gradient(135deg,#ff9c3c,#ff6366);border-color:transparent;color:white;transform:scale(1.08);box-shadow:0 4px 16px rgba(255,120,80,0.4);}
.side-nav.disabled{opacity:0.12;pointer-events:none;}
#viewer-inner{position:absolute;left:48px;right:48px;top:0;bottom:0;overflow-y:auto;overflow-x:auto;padding:8px 4px 80px;}
@media(max-width:600px){
  #viewer-inner{left:36px;right:36px;padding:4px 2px 70px;}
  .side-nav{width:36px;}
  #zoom-bar{bottom:10px;}
}
#pdf-canvas-wrapper{position:relative;display:inline-flex;justify-content:center;width:100%;}
#pdf-canvas{max-width:100%;box-shadow:0 4px 40px rgba(0,0,0,0.7);border-radius:3px;display:block;background:white;}
#annotation-canvas{position:absolute;top:0;left:0;pointer-events:none;display:block;}
#text-layer{position:absolute;top:0;left:0;overflow:hidden;line-height:1;cursor:text;}
#text-layer span{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 100%;user-select:text;-webkit-user-select:text;}
#text-layer ::selection{background:rgba(160,80,255,0.3);}

/* ── SELECTION TOOLBAR ── */
#sel-toolbar{
  position:fixed;background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--rr);padding:5px 7px;
  display:none;gap:3px;z-index:300;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);
  flex-wrap:nowrap;align-items:center;
}
#sel-toolbar::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--grad2);border-radius:var(--rr) var(--rr) 0 0;
}
#sel-toolbar button{
  background:none;border:none;
  font-family:'DM Mono',monospace;font-size:0.62rem;
  cursor:pointer;padding:5px 9px;border-radius:7px;
  white-space:nowrap;transition:all 0.12s;color:var(--text2);
}
#sel-toolbar button:hover{background:rgba(255,255,255,0.1);color:var(--text);}
.hl-y{color:#ffd932!important;}
.hl-p{color:#ff5ab4!important;}
.hl-b{color:#3c96ff!important;}
.tb-div{width:1px;height:16px;background:var(--border2);flex-shrink:0;}

/* ── ZOOM CONTROLS ── */
#zoom-bar{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  display:none;align-items:center;gap:6px;z-index:110;
  background:rgba(13,13,20,0.9);border:1px solid var(--border2);
  border-radius:30px;padding:6px 12px;backdrop-filter:blur(12px);
  box-shadow:0 4px 24px rgba(0,0,0,0.5);
}
.zoom-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.08);color:var(--text);
  font-size:1.2rem;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all 0.15s;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.zoom-btn:hover{background:linear-gradient(135deg,#ff9c3c,#ff6366);color:white;}
#zoom-level{
  font-family:'DM Mono',monospace;font-size:0.65rem;
  color:var(--text2);min-width:36px;text-align:center;
}
/* ── CLEAR HIGHLIGHT ── */
#clear-hl-btn{
  position:fixed;bottom:20px;left:56px;display:none;
  padding:6px 14px;background:rgba(13,13,20,0.9);
  color:var(--text3);border:1px solid var(--border2);
  border-radius:20px;font-family:'DM Mono',monospace;
  font-size:0.6rem;cursor:pointer;z-index:100;
  transition:all 0.15s;backdrop-filter:blur(10px);
}
#clear-hl-btn:hover{background:linear-gradient(135deg,#ff6366,#ff9c3c);color:white;border-color:transparent;}

/* ── NOTEBOOK ── */
#notebook-screen{display:none;width:100%;height:100%;flex-direction:column;overflow:hidden;background:var(--bg);}
.nb-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.nb-title{
  font-family:'Nunito',sans-serif;font-size:1.4rem;font-weight:900;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.nb-sub{font-size:0.76rem;color:var(--text3);margin-top:3px;}
.nb-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;padding:0 24px;overflow-x:auto;scrollbar-width:none;}
.nb-tabs::-webkit-scrollbar{display:none;}
.nb-tab{padding:10px 16px;font-family:'DM Mono',monospace;font-size:0.63rem;cursor:pointer;border-bottom:2px solid transparent;color:var(--text3);transition:all 0.15s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;}
.nb-tab.active{color:var(--text);border-bottom-color:transparent;position:relative;}
.nb-tab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--grad2);}
.nb-tab:hover:not(.active){color:var(--text2);}
.nb-body{flex:1;overflow-y:auto;padding:18px 24px 30px;}
.note-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rr);padding:13px 15px;margin-bottom:10px;position:relative;animation:noteIn 0.2s ease;transition:border-color 0.15s;}
.note-card:hover{border-color:var(--border2);}
@keyframes noteIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.note-meta{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap;}
.note-ch{font-family:'DM Mono',monospace;font-size:0.57rem;background:rgba(255,255,255,0.07);color:var(--text3);padding:2px 7px;border-radius:20px;}
.note-pg{font-family:'DM Mono',monospace;font-size:0.57rem;color:var(--text3);}
.note-type{font-family:'DM Mono',monospace;font-size:0.56rem;padding:2px 7px;border-radius:20px;font-weight:700;}
.nt-manual{background:rgba(255,165,60,0.15);color:#ff9c3c;}
.nt-qa{background:rgba(60,210,120,0.15);color:#3cd278;}
.nt-hl{background:rgba(255,220,50,0.15);color:#ffd932;}
.nt-ex{background:rgba(60,150,255,0.15);color:#3c96ff;}
.note-date{font-size:0.6rem;color:var(--text3);margin-left:auto;}
.note-excerpt{font-size:0.82rem;font-style:italic;color:var(--text2);border-left:2px solid;border-image:var(--grad) 1;padding-left:10px;line-height:1.55;margin-bottom:5px;}
.note-text{font-size:0.84rem;color:var(--text);line-height:1.6;}
.note-q{font-size:0.8rem;font-weight:700;color:var(--text);margin-bottom:3px;font-family:'Nunito',sans-serif;}
.note-a{font-size:0.8rem;color:var(--text2);line-height:1.6;}
.note-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:0.66rem;opacity:0.5;transition:all 0.12s;}
.note-del:hover{opacity:1;color:#ff6366;}
.nb-add-form{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rr);padding:14px 16px;margin-bottom:16px;}
.nb-add-form textarea{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-family:'Nunito Sans',sans-serif;font-size:0.84rem;resize:none;min-height:68px;outline:none;transition:border-color 0.15s;line-height:1.5;}
.nb-add-form textarea:focus{border-color:rgba(160,80,255,0.5);}
.nb-add-form textarea::placeholder{color:var(--text3);font-style:italic;}
.nb-save-btn{display:block;margin-top:8px;margin-left:auto;padding:7px 20px;background:linear-gradient(135deg,#3c96ff,#a050ff);color:white;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:800;cursor:pointer;transition:filter 0.12s;box-shadow:0 3px 12px rgba(100,80,255,0.35);}
.nb-save-btn:hover{filter:brightness(1.1);}
.nb-empty{text-align:center;padding:48px 20px;color:var(--text3);font-style:italic;font-size:0.86rem;}

/* ── FABs ── */
.fab-cluster{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:100;}
.fab{border-radius:50%;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:all 0.22s cubic-bezier(0.34,1.56,0.64,1);}
.fab:hover{transform:scale(1.12);}
.fab svg{fill:white;}
#chat-fab{width:52px;height:52px;background:linear-gradient(135deg,#ff9c3c,#ff6366);box-shadow:0 4px 20px rgba(255,120,80,0.4);}
#chat-fab svg{width:22px;height:22px;}
#note-fab{width:40px;height:40px;background:linear-gradient(135deg,#3c96ff,#a050ff);box-shadow:0 3px 14px rgba(100,80,255,0.4);}
#note-fab svg{width:17px;height:17px;}
.fab-dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;background:#ffd932;border-radius:50%;border:2px solid var(--bg);display:none;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.3);}}

/* ── CHAT PANEL ── */
#chat-panel{
  position:fixed;bottom:82px;right:20px;
  width:360px;max-height:62vh;
  background:var(--bg2);border-radius:var(--rr2);
  border:1px solid var(--border);
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
  display:flex;flex-direction:column;
  z-index:99;overflow:hidden;
  transform:scale(0.88) translateY(16px);opacity:0;pointer-events:none;
  transition:all 0.26s cubic-bezier(0.34,1.56,0.64,1);
  transform-origin:bottom right;
}
#chat-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad2);z-index:1;}
#chat-panel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all;}
.chat-top{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;flex-shrink:0;}
.chat-av{
  width:30px;height:30px;border-radius:50%;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-family:'Nunito',sans-serif;font-size:0.8rem;font-weight:900;color:white;flex-shrink:0;
}
.chat-info{flex:1;}
.chat-name{font-family:'Nunito',sans-serif;font-size:0.9rem;font-weight:800;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.chat-st{font-size:0.6rem;color:var(--text3);font-family:'DM Mono',monospace;}
.chat-clr{background:none;border:1px solid var(--border);color:var(--text3);padding:3px 9px;border-radius:6px;font-size:0.6rem;cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.12s;}
.chat-clr:hover{border-color:#ff6366;color:#ff6366;}
#chat-messages{flex:1;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.msg{display:flex;flex-direction:column;gap:3px;animation:msgIn 0.2s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.msg-lbl{font-size:0.58rem;font-family:'DM Mono',monospace;color:var(--text3);padding:0 2px;}
.msg-user .msg-lbl{text-align:right;}
.msg-bubble{padding:9px 13px;border-radius:12px;font-size:0.84rem;line-height:1.6;max-width:93%;}
.msg-user .msg-bubble{background:linear-gradient(135deg,#ff9c3c,#ff6366);color:white;align-self:flex-end;border-bottom-right-radius:3px;}
.msg-ai .msg-bubble{background:var(--bg3);color:var(--text);align-self:flex-start;border-bottom-left-radius:3px;border:1px solid var(--border);}
.msg-ai .msg-bubble strong{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.msg-ai .msg-bubble em{color:#ff9c3c;font-style:italic;}
.msg-ai .msg-bubble code{font-family:'DM Mono',monospace;font-size:0.76rem;background:rgba(160,80,255,0.15);padding:1px 5px;border-radius:4px;color:#a050ff;}
.msg-save{align-self:flex-start;margin-top:1px;background:none;border:none;color:#3cd278;font-family:'DM Mono',monospace;font-size:0.57rem;cursor:pointer;padding:2px 4px;border-radius:4px;opacity:0.7;transition:opacity 0.12s;}
.msg-save:hover{opacity:1;}
.typing{display:flex;gap:4px;align-items:center;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;border-bottom-left-radius:3px;align-self:flex-start;}
.typing-dot{width:5px;height:5px;border-radius:50%;opacity:0.5;animation:typeBounce 1.2s infinite;}
.typing-dot:nth-child(1){background:#ff6366;animation-delay:0s;}
.typing-dot:nth-child(2){background:#ffd932;animation-delay:0.2s;}
.typing-dot:nth-child(3){background:#3c96ff;animation-delay:0.4s;}
@keyframes typeBounce{0%,60%,100%{opacity:.4;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}
.chat-input-row{padding:10px;border-top:1px solid var(--border);display:flex;gap:6px;align-items:flex-end;flex-shrink:0;}
#chat-input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 12px;font-family:'Nunito Sans',sans-serif;font-size:0.84rem;resize:none;min-height:38px;max-height:100px;outline:none;transition:border-color 0.15s;line-height:1.4;}
#chat-input:focus{border-color:rgba(160,80,255,0.5);}
#chat-input::placeholder{color:var(--text3);}
#chat-send{width:36px;height:36px;background:linear-gradient(135deg,#ff9c3c,#ff6366);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:filter 0.12s;box-shadow:0 2px 10px rgba(255,120,80,0.35);}
#chat-send:hover{filter:brightness(1.1);}
#chat-send:disabled{opacity:0.35;cursor:not-allowed;}
#chat-send svg{width:14px;height:14px;fill:white;}

/* ── QUICK NOTE ── */
#qn-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:none;align-items:flex-end;justify-content:center;padding-bottom:70px;backdrop-filter:blur(6px);}
#qn-overlay.open{display:flex;}
#qn-box{background:var(--bg2);border-radius:var(--rr2) var(--rr2) 0 0;width:100%;max-width:520px;padding:20px 20px 24px;border:1px solid var(--border);border-bottom:none;box-shadow:0 -8px 40px rgba(0,0,0,0.5);animation:slideUp 0.24s cubic-bezier(0.34,1.2,0.64,1);position:relative;}
#qn-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad2);border-radius:var(--rr2) var(--rr2) 0 0;}
@keyframes slideUp{from{transform:translateY(50px);opacity:0;}to{transform:none;opacity:1;}}
.qn-title{font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;color:var(--text);margin-bottom:12px;}
.qn-title span{font-family:'DM Mono',monospace;font-size:0.63rem;color:var(--text3);margin-left:8px;font-style:normal;font-weight:400;}
#qn-input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:var(--rr);padding:10px 14px;font-family:'Nunito Sans',sans-serif;font-size:0.86rem;resize:none;min-height:88px;outline:none;transition:border-color 0.15s;line-height:1.5;}
#qn-input:focus{border-color:rgba(160,80,255,0.5);}
#qn-input::placeholder{color:var(--text3);font-style:italic;}
.qn-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;}
.qn-cancel{padding:7px 16px;background:none;border:1px solid var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:0.65rem;cursor:pointer;color:var(--text3);transition:all 0.12s;}
.qn-cancel:hover{border-color:var(--border2);color:var(--text2);}
.qn-save{padding:7px 20px;background:linear-gradient(135deg,#3c96ff,#a050ff);color:white;border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:800;cursor:pointer;transition:filter 0.12s;box-shadow:0 3px 12px rgba(100,80,255,0.3);}
.qn-save:hover{filter:brightness(1.1);}

@media(max-width:520px){
  #chat-panel{width:calc(100vw - 14px);right:7px;bottom:72px;}
  .fab-cluster{right:14px;bottom:14px;}
  .chapters-grid,.lib-grid{grid-template-columns:1fr;}
  .side-nav{width:36px;}
  #viewer-inner{left:36px;right:36px;}
}
</style>
</head>
<body>

<header>
  <div class="logo" id="app-name-btn">Ladder<sup>β</sup></div>
  <div class="hdr-chapter" id="hdr-ch-tag"></div>
  <div class="hdr-right">
    <span class="page-badge" id="page-info" style="display:none"></span>
    <button class="hbtn" id="resume-btn" style="display:none">▶ Resume</button>
    <button class="hbtn" id="chapters-btn" style="display:none">Chapters</button>
    <button class="hbtn" id="notebook-btn" style="display:none">Notebook</button>
    <button class="hbtn" id="library-btn" style="display:none">Library</button>
  </div>
</header>

<main>
  <div id="library-screen">
    <div class="lib-top">
      <div><div class="lib-eyebrow">YOUR LIBRARY</div><div class="lib-heading">Study Books</div></div>
      <button class="add-btn" id="add-book-btn">+ Add Book</button>
    </div>
    <div class="lib-grid" id="lib-grid"></div>
  </div>

  <div id="analyzing-screen">
    <div class="spin" id="analyzing-spinner"></div>
    <div class="analyzing-title" id="analyzing-title">Reading your PDF…</div>
    <div class="analyzing-sub">Detecting chapters and structure</div>
    <div id="analyzing-progress">Loading…</div>
    <button id="reselect-btn" style="display:none" onclick="document.getElementById('pdf-input').click()">Select PDF File</button>
  </div>

  <div id="chapter-screen">
    <div class="ch-top">
      <div><div class="ch-eyebrow">CHOOSE A CHAPTER</div><div class="ch-heading">Where to?</div><div class="ch-sub">Ladder remembers exactly where you left off</div><div class="ch-file" id="ch-file"></div></div>
      <button class="ch-back" id="ch-back-btn">← Library</button>
    </div>
    <div class="chapters-grid" id="chapters-grid"></div>
    <div style="text-align:center;margin-top:20px"><button id="rescan-btn" style="background:none;border:1px solid rgba(255,255,255,0.15);color:rgba(240,240,255,0.4);padding:7px 18px;border-radius:20px;font-family:DM Mono,monospace;font-size:0.62rem;cursor:pointer;transition:all 0.15s" onmouseover="this.style.borderColor='rgba(255,255,255,0.3)';this.style.color='rgba(240,240,255,0.7)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.15)';this.style.color='rgba(240,240,255,0.4)'">↺ Re-scan chapters</button></div>
  </div>

  <div id="viewer-screen">
    <div class="side-nav disabled" id="nav-prev"><div class="side-arrow">&#8592;</div></div>
    <div id="viewer-inner">
      <div id="pdf-canvas-wrapper">
        <canvas id="pdf-canvas"></canvas>
        <canvas id="annotation-canvas"></canvas>
        <div id="text-layer"></div>
      </div>
    </div>
    <div class="side-nav disabled" id="nav-next"><div class="side-arrow">&#8594;</div></div>
    <div id="zoom-bar">
      <button class="zoom-btn" id="zoom-out" title="Zoom out">−</button>
      <span id="zoom-level">100%</span>
      <button class="zoom-btn" id="zoom-in" title="Zoom in">+</button>
      <button class="zoom-btn" id="zoom-fit" title="Fit to screen" style="font-size:0.7rem;width:auto;padding:0 8px;border-radius:12px;">Fit</button>
    </div>
  </div>

  <div id="notebook-screen">
    <div class="nb-header"><div class="nb-title">📓 Notebook</div><div class="nb-sub">Your highlights, excerpts, notes and saved Q&amp;A</div></div>
    <div class="nb-tabs" id="nb-tabs"></div>
    <div class="nb-body" id="nb-body"></div>
  </div>
</main>

<div class="fab-cluster">
  <button class="fab" id="note-fab" title="Add note">
    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
  </button>
  <button class="fab" id="chat-fab" title="Ask AI">
    <div class="fab-dot" id="chat-badge"></div>
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 10H6v-2h12v2zm0-3H6V7h12v2z"/></svg>
  </button>
</div>

<div id="chat-panel">
  <div class="chat-top">
    <div class="chat-av">L</div>
    <div class="chat-info"><div class="chat-name">Study Assistant</div><div class="chat-st" id="chat-status">Ready to help</div></div>
    <button class="chat-clr" id="clear-chat-btn">Clear</button>
  </div>
  <div id="chat-messages"></div>
  <div class="chat-input-row">
    <textarea id="chat-input" placeholder="Ask anything…" rows="1"></textarea>
    <button id="chat-send"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </div>
</div>

<div id="qn-overlay">
  <div id="qn-box">
    <div class="qn-title">Add Note <span id="qn-tag"></span></div>
    <textarea id="qn-input" placeholder="What did you think, understand, or want to remember?"></textarea>
    <div class="qn-actions">
      <button class="qn-cancel" id="qn-cancel">Cancel</button>
      <button class="qn-save" id="qn-save">Save</button>

</div>

<div id="sel-toolbar">
  <button class="hl-y" id="tb-hl-y">◼ Yellow</button>
  <button class="hl-p" id="tb-hl-p">◼ Pink</button>
  <button class="hl-b" id="tb-hl-b">◼ Blue</button>
  <div class="tb-div"></div>
  <button id="tb-excerpt">📋 Save</button>
  <button id="tb-ask">💬 Ask AI</button>
  <button id="tb-dismiss">✕</button>
</div>

<button id="clear-hl-btn">🧹 Clear highlights</button>
<input type="file" id="pdf-input" accept=".pdf" style="display:none">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const store={get:(k,d=null)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};
const K={lib:'ldr_lib',chaps:id=>`ldr_chap_${id}`,page:(id,ci)=>`ldr_pg_${id}_${ci}`,lastCh:id=>`ldr_lc_${id}`,chat:(id,ci)=>`ldr_ct_${id}_${ci}`,notes:id=>`ldr_nt_${id}`,annot:(id,pg)=>`ldr_an_${id}_${pg}`};
const IDB=(()=>{let db=null;const DB='LadderPDFs',VER=1,ST='pdfs';function open(){return new Promise((res,rej)=>{if(db){res(db);return;}const r=indexedDB.open(DB,VER);r.onupgradeneeded=e=>e.target.result.createObjectStore(ST);r.onsuccess=e=>{db=e.target.result;res(db);};r.onerror=()=>rej(r.error);});}async function put(id,buf){const d=await open();return new Promise((res,rej)=>{const tx=d.transaction(ST,'readwrite');tx.objectStore(ST).put(buf,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}async function get(id){const d=await open();return new Promise((res,rej)=>{const tx=d.transaction(ST,'readonly');const r=tx.objectStore(ST).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});}async function del(id){const d=await open();return new Promise((res,rej)=>{const tx=d.transaction(ST,'readwrite');tx.objectStore(ST).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}return{put,get,del};})();

let pdfDoc=null,currentPage=1,totalPages=0,pdfRawBuf=null,pdfFullText=null;
let bookId='',isReopenMode=false,chapters=[],activeChapter=null;
let isRendering=false,chatOpen=false,isAIThinking=false,conversationHistory=[],selText='';
let zoomLevel=1.0; // 1.0 = fit to screen

document.addEventListener('DOMContentLoaded',function(){
const $=id=>document.getElementById(id);
const pdfInput=$('pdf-input'),pdfCanvas=$('pdf-canvas'),annotCanvas=$('annotation-canvas'),textLayerDiv=$('text-layer');
const pageInfo=$('page-info'),navPrev=$('nav-prev'),navNext=$('nav-next');
const chaptersBtn=$('chapters-btn'),notebookBtn=$('notebook-btn'),libraryBtn=$('library-btn'),resumeBtn=$('resume-btn');
const chatFab=$('chat-fab'),noteFab=$('note-fab'),chatPanel=$('chat-panel'),chatMessages=$('chat-messages');
const chatInput=$('chat-input'),chatSend=$('chat-send'),chatStatus=$('chat-status'),chatBadge=$('chat-badge');
const hdrChTag=$('hdr-ch-tag'),analyzingProg=$('analyzing-progress'),chaptersGrid=$('chapters-grid'),libGrid=$('lib-grid');
const nbTabs=$('nb-tabs'),nbBody=$('nb-body'),qnOverlay=$('qn-overlay'),qnInput=$('qn-input'),qnTag=$('qn-tag');
const selToolbar=$('sel-toolbar'),viewerInner=$('viewer-inner');

const SCREENS={library:$('library-screen'),analyzing:$('analyzing-screen'),chapters:$('chapter-screen'),viewer:$('viewer-screen'),notebook:$('notebook-screen')};
function showScreen(name){
  Object.values(SCREENS).forEach(el=>el.style.display='none');
  const el=SCREENS[name];
  el.style.display=(name==='library'||name==='chapters'||name==='viewer')?'block':'flex';
  if(name==='notebook')el.style.display='flex';
  chaptersBtn.style.display=(name==='viewer')?'block':'none';
  notebookBtn.style.display=(name==='viewer'||name==='chapters')?'block':'none';
  libraryBtn.style.display=(name==='viewer'||name==='chapters'||name==='notebook')?'block':'none';
  resumeBtn.style.display=(name!=='viewer'&&activeChapter!==null&&pdfDoc)?'block':'none';
  const iv=(name==='viewer');
  chatFab.style.display=iv?'flex':'none';noteFab.style.display=iv?'flex':'none';
  navPrev.style.display=iv?'flex':'none';navNext.style.display=iv?'flex':'none';
  pageInfo.style.display=iv?'block':'none';
  $('zoom-bar').style.display=iv?'flex':'none';
  if(!iv)$('clear-hl-btn').style.display='none';
}

$('app-name-btn').addEventListener('click',showLibrary);
libraryBtn.addEventListener('click',showLibrary);
resumeBtn.addEventListener('click',()=>{if(activeChapter===null||!pdfDoc)return;showScreen('viewer');hdrChTag.textContent=chapters[activeChapter].title;});
$('add-book-btn').addEventListener('click',()=>{isReopenMode=false;pdfInput.value='';pdfInput.click();});

function showLibrary(){showScreen('library');hdrChTag.textContent='';chatPanel.classList.remove('open');chatOpen=false;renderLibraryGrid();}

function renderLibraryGrid(){
  const lib=store.get(K.lib,[]);
  if(!lib.length){libGrid.innerHTML='<div class="lib-empty"><span class="lib-empty-icon">📚</span><p>No books yet. Add your first PDF!</p></div>';return;}
  libGrid.innerHTML='';
  lib.forEach(book=>{
    const chaps=store.get(K.chaps(book.id),[]),notes=store.get(K.notes(book.id),[]);
    let tr=0,tp=0;chaps.forEach((ch,i)=>{const pg=store.get(K.page(book.id,i),null);const len=ch.endPage-ch.startPage+1;tp+=len;if(pg)tr+=pg-ch.startPage+1;});
    const pct=tp>0?Math.min(100,Math.round((tr/tp)*100)):0;
    const card=document.createElement('div');card.className='book-card';
    card.innerHTML=`<div class="book-spine"></div><div class="book-body"><div class="book-title">${esc(book.title||book.fileName)}</div><div class="book-file">${esc(book.fileName)}</div><div class="book-meta"><span class="book-tag btag-g">${pct}% read</span>${notes.length?`<span class="book-tag btag-n">${notes.length} note${notes.length>1?'s':''}</span>`:''}<span style="font-size:0.6rem;color:var(--text3)">${chaps.length} ch.</span></div><div class="book-bar-wrap"><div class="book-bar" style="width:${pct}%"></div></div></div><button class="book-del" data-id="${book.id}">✕</button>`;
    card.addEventListener('click',e=>{if(e.target.classList.contains('book-del'))return;openBook(book.id,book.fileName);});
    const del=card.querySelector('.book-del');
    del.addEventListener('click',e=>{e.stopPropagation();if(del.dataset.confirm==='1'){removeBook(book.id);}else{del.dataset.confirm='1';del.textContent='Sure?';del.style.background='#ff6366';del.style.color='white';setTimeout(()=>{if(del.dataset.confirm==='1'){del.dataset.confirm='';del.textContent='✕';del.style.background='';del.style.color='';}},3000);}});
    libGrid.appendChild(card);
  });
}
function removeBook(id){const chaps=store.get(K.chaps(id),[]);chaps.forEach((_,i)=>{try{localStorage.removeItem(K.page(id,i));}catch{};try{localStorage.removeItem(K.chat(id,i));}catch{};});[K.chaps(id),K.notes(id),K.lastCh(id)].forEach(k=>{try{localStorage.removeItem(k);}catch{}});store.set(K.lib,store.get(K.lib,[]).filter(b=>b.id!==id));IDB.del(id).catch(()=>{});renderLibraryGrid();}

async function openBook(id,fileName){
  const chaps=store.get(K.chaps(id),null);if(!chaps){alert('Chapter data missing. Please re-add this PDF.');return;}
  bookId=id;chapters=chaps;$('ch-file').textContent=fileName||'';
  showScreen('analyzing');$('analyzing-spinner').style.display='block';$('analyzing-title').textContent='Loading saved PDF…';analyzingProg.textContent='Reading from local storage…';$('reselect-btn').style.display='none';
  try{const buf=await IDB.get(id);if(buf){analyzingProg.textContent='Preparing pages…';await loadPdfBinary(buf);renderChapterPicker();return;}}catch(e){}
  $('analyzing-spinner').style.display='none';$('analyzing-title').textContent='One-time file load needed';
  analyzingProg.textContent="Your PDF was not found in local storage. Select it once and it will be saved automatically.";
  $('reselect-btn').style.display='block';isReopenMode=true;pdfInput.value='';
}

pdfInput.addEventListener('change',async(e)=>{
  const file=e.target.files[0];if(!file)return;
  if(isReopenMode){
    showScreen('analyzing');$('analyzing-spinner').style.display='block';$('analyzing-title').textContent='Reading your PDF…';$('reselect-btn').style.display='none';analyzingProg.textContent='Loading PDF…';

  }

async function loadPdfBinary(buf){pdfRawBuf=buf;pdfFullText=null;pdfDoc=await pdfjsLib.getDocument({data:buf}).promise;totalPages=pdfDoc.numPages;}

async function buildPdfTextContext(){
  if(!pdfDoc||activeChapter===null)return;
  const from=Math.max(1,currentPage-1),to=Math.min(totalPages,currentPage+2);
  let pages=[];
  for(let i=from;i<=to;i++){const page=await pdfDoc.getPage(i);const tc=await page.getTextContent();const txt=tc.items.map(x=>x.str).join(' ').substring(0,1200);pages.push('--- Page '+i+' ---\n'+txt);}
  pdfFullText=pages.join('\n');
}

async function extractPageTexts(){
  const out=[],limit=Math.min(totalPages,150);
  for(let i=1;i<=limit;i++){const page=await pdfDoc.getPage(i);const tc=await page.getTextContent();const topText=tc.items.slice(0,8).map(x=>x.str.trim()).filter(Boolean).join(' ');out.push({page:i,text:topText.substring(0,120)});if(i%20===0)analyzingProg.textContent=`Scanning page ${i}/${limit}…`;}
  return out;
}
function makeFallbackChapters(){const out=[];for(let p=1;p<=totalPages;p+=20)out.push({title:`Pages ${p}\u2013${Math.min(p+19,totalPages)}`,startPage:p,endPage:Math.min(p+19,totalPages)});return out;}
async function detectChapters(texts){
  analyzingProg.textContent='Detecting chapters…';

  // Always use AI when on server — it is far more reliable than patterns
  const isLocal=window.location.protocol==='file:';

  if(!isLocal){
    analyzingProg.textContent='Asking AI to identify chapters…';
    const sample=texts.slice(0,Math.min(texts.length,100))
      .map(p=>`p${p.page}: ${p.text.substring(0,150)}`).join('\n');

    const prompt=`You are analyzing a PDF textbook. Below is the first ~150 characters from the top of each page.

Your job: identify where MAIN chapters begin and give each a SHORT name (3-5 words max).

Rules:
1. Find real chapter boundaries — where the subject changes significantly
2. Ignore running page headers (text that repeats every page)
3. Ignore sub-sections, activities, examples within a chapter
4. Each chapter should span at least 5 pages
5. If the chapter has a real name, shorten it to 3-5 words
6. If no real name found, create a 3-5 word descriptive title based on the content
7. Return ONLY a JSON array, no explanation:

[
  {"title":"Intro to Game Theory","startPage":5},
  {"title":"Two-Person Zero-Sum Games","startPage":20},
  {"title":"Nash Equilibrium","startPage":45}
]

If you cannot find at least 2 clear chapters, return [].

PAGE DATA:
${sample}`;

    try{
      const res=await fetch('/api/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1000,messages:[{role:'user',content:prompt}]})
      });
      if(res.ok){
        const data=await res.json();
        if(!data.error){
          const raw=data.content?.find(b=>b.type==='text')?.text||'';
          const match=raw.replace(/```json|```/g,'').trim().match(/\[[\s\S]*\]/);
          if(match){
            let list=JSON.parse(match[0]);
            if(Array.isArray(list)&&list.length>=2){
              const result=list.map((ch,i)=>({
                title:ch.title||`Chapter ${i+1}`,
                startPage:Math.max(1,Number(ch.startPage)||1),
                endPage:i+1<list.length?Number(list[i+1].startPage)-1:totalPages
              })).filter(ch=>ch.endPage-ch.startPage>=4);
              if(result.length>=2) return result;
            }
          }
        }
      }
    }catch(e){ console.warn('AI chapter detect failed:',e); }
  }

  // Local fallback: pattern-based detection
  analyzingProg.textContent='Scanning for chapters…';
  const freq={};
  texts.forEach(({text})=>{
    const key=text.replace(/[\d\s.,:;!?()-]+$/,'').toLowerCase().trim().substring(0,40);
    freq[key]=(freq[key]||0)+1;
  });
  const pats=[
    /^chapter\s+[\divxlcdm]+/i,
    /^\d+\.?\s+[A-Z][a-z]{2}/,
    /^part\s+[\divxlcdm\d]+/i,
    /^introduction\b/i,/^conclusion\b/i,/^appendix\b/i,
  ];
  const found=[];
  for(const {page,text} of texts){
    if(!text) continue;
    const t=text.trim().replace(/\s{2,}/g,' ');
    if(t.length<3||t.length>100) continue;
    const key=t.replace(/[\d\s.,:;!?()-]+$/,'').toLowerCase().trim().substring(0,40);
    if((freq[key]||0)>3) continue;
    if(!pats.some(p=>p.test(t))) continue;
    const last=found[found.length-1];
    if(last&&page-last.startPage<5) continue;
    found.push({title:t.replace(/^(\d+)\s+/,'Chapter $1: ').trim(),startPage:page});
  }
  if(found.length>=2){
    const r=found.map((ch,i)=>({...ch,endPage:i+1<found.length?found[i+1].startPage-1:totalPages}))
      .filter(ch=>ch.endPage-ch.startPage>=4);
    if(r.length>=2) return r;
  }

  return makeFallbackChapters();
}

async function renderPage(num){
  if(isRendering)return;isRendering=true;hideSelToolbar();
  const page=await pdfDoc.getPage(num);

  // Step 1: figure out CSS display size first (fit to screen × zoom)
  const availW=viewerInner.clientWidth - 8;
  const cssW=Math.round(availW*zoomLevel);

  // Step 2: render at high resolution for crisp text (scale to actual canvas pixels)
  const dpr=window.devicePixelRatio||1;
  // We want canvas pixels = cssW * dpr for retina sharpness
  const page1=page.getViewport({scale:1});
  const renderScale=(cssW*dpr)/page1.width;
  const vp=page.getViewport({scale:renderScale});

  const ctx=pdfCanvas.getContext('2d');
  pdfCanvas.width=vp.width;pdfCanvas.height=vp.height;
  const cssH=Math.round(vp.height/dpr);
  pdfCanvas.style.width=cssW+'px';pdfCanvas.style.height=cssH+'px';
  await page.render({canvasContext:ctx,viewport:vp}).promise;

  // Sync annotation canvas to same CSS size as PDF canvas
  annotCanvas.width=vp.width;annotCanvas.height=vp.height;
  annotCanvas.style.width=cssW+'px';annotCanvas.style.height=cssH+'px';
  requestAnimationFrame(()=>{
    const off=pdfCanvas.offsetLeft;
    annotCanvas.style.left=off+'px';
    textLayerDiv.style.left=off+'px';
  });
  textLayerDiv.style.width=cssW+'px';textLayerDiv.style.height=cssH+'px';
  textLayerDiv.innerHTML='';
  const tcontent=await page.getTextContent();
  const sr=cssW/vp.width;  // CSS px per canvas px
  tcontent.items.forEach(item=>{
    if(!item.str.trim())return;const tx=pdfjsLib.Util.transform(vp.transform,item.transform);
    const fontSize=Math.abs(tx[3])*sr,cssX=tx[4]*sr,cssY=(vp.height-tx[5])*sr;
    const angle=Math.atan2(tx[1],tx[0]);const span=document.createElement('span');
    span.textContent=item.str;span.style.fontSize=fontSize+'px';span.style.left=cssX+'px';span.style.top=cssY+'px';span.style.lineHeight='1';span.style.transformOrigin='0% 100%';
    if(angle)span.style.transform=`rotate(${angle}rad)`;textLayerDiv.appendChild(span);
  });
  restoreAnnotations(num);
  const ch=chapters[activeChapter];pageInfo.textContent=`p.${num}  ${num-ch.startPage+1}/${ch.endPage-ch.startPage+1}`;
  navPrev.classList.toggle('disabled',num<=ch.startPage);navNext.classList.toggle('disabled',num>=ch.endPage);
  viewerInner.scrollTop=0;store.set(K.page(bookId,activeChapter),num);pdfFullText=null;isRendering=false;
}

// Pinch-to-zoom on mobile
let lastPinchDist=0;
viewerInner.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    lastPinchDist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
  }
},{passive:true});
viewerInner.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const dist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    if(lastPinchDist>0){
      const delta=dist/lastPinchDist;
      zoomLevel=Math.min(3.0,Math.max(0.5,zoomLevel*delta));
      updateZoomLabel();
      // Apply zoom via CSS for smooth live feel during pinch
      const liveW=Math.round((viewerInner.clientWidth-8)*zoomLevel)+'px';
      pdfCanvas.style.width=liveW;
      annotCanvas.style.width=liveW;
      textLayerDiv.style.width=liveW;
    }
    lastPinchDist=dist;
  }
},{passive:true});
viewerInner.addEventListener('touchend',e=>{
  if(e.touches.length<2&&lastPinchDist>0){
    lastPinchDist=0;
    // Re-render at new zoom level for full quality
    renderPage(currentPage);
  }
},{passive:true});

  if(now-lastTap<300){

},{passive:true});

function applyHighlight(cssColor,label){
  const sel=window.getSelection();if(!sel||!sel.rangeCount){hideSelToolbar();return;}
  const range=sel.getRangeAt(0);const clientRects=[...range.getClientRects()];if(!clientRects.length){hideSelToolbar();return;}
  const canvasBR=annotCanvas.getBoundingClientRect();
  const scaleX=annotCanvas.width/canvasBR.width,scaleY=annotCanvas.height/canvasBR.height;
  const rects=clientRects.map(r=>({x:(r.left-canvasBR.left)*scaleX,y:(r.top-canvasBR.top)*scaleY,w:r.width*scaleX,h:r.height*scaleY})).filter(r=>r.w>1&&r.h>1);
  if(!rects.length){hideSelToolbar();return;}
  const ctx=annotCanvas.getContext('2d');drawHL(ctx,rects,cssColor);
  const saved=store.get(K.annot(bookId,currentPage),[]);saved.push({rects,color:cssColor,text:selText});store.set(K.annot(bookId,currentPage),saved);
  saveNote({type:'highlight',text:selText,color:label,cssColor,chapterIdx:activeChapter,page:currentPage});
  $('clear-hl-btn').style.display='block';window.getSelection()?.removeAllRanges();hideSelToolbar();
}

qnOverlay.addEventListener('click',e=>{if(e.target===qnOverlay)qnOverlay.classList.remove('open');});

chatFab.addEventListener('click',()=>{chatOpen=!chatOpen;chatPanel.classList.toggle('open',chatOpen);chatBadge.style.display='none';if(chatOpen){setTimeout(()=>chatInput.focus(),280);chatMessages.scrollTop=chatMessages.scrollHeight;}});
chatInput.addEventListener('input',()=>{chatInput.style.height='auto';chatInput.style.height=Math.min(chatInput.scrollHeight,100)+'px';});
chatInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
chatSend.addEventListener('click',sendMessage);
$('clear-chat-btn').addEventListener('click',()=>{conversationHistory=[];store.set(K.chat(bookId,activeChapter),[]);chatMessages.innerHTML='';addWelcomeMsg();});

function renderSavedMessages(){chatMessages.innerHTML='';if(!conversationHistory.length){addWelcomeMsg();return;}conversationHistory.forEach((m,i)=>appendMsg(m.role==='user'?'user':'ai',m.content,false,i));}
function addWelcomeMsg(){appendMsg('ai',`Ready to help with **${chapters[activeChapter]?.title||'this chapter'}**. Ask me anything or select text on the page. 🌈`,false);}
function appendMsg(role,text,animate=true,histIdx=null){
  const div=document.createElement('div');div.className=`msg msg-${role}`;if(!animate)div.style.animation='none';
  div.innerHTML=`<div class="msg-lbl">${role==='user'?'You':'Assistant'}</div><div class="msg-bubble">${role==='user'?esc(text):fmt(text)}</div>`;
  if(role==='ai'&&histIdx!==null&&histIdx>0){const sb=document.createElement('button');sb.className='msg-save';sb.textContent='+ Save to Notebook';sb.addEventListener('click',()=>{saveNote({type:'qa',question:conversationHistory[histIdx-1]?.content||'',answer:conversationHistory[histIdx]?.content||text,chapterIdx:activeChapter,page:currentPage});sb.textContent='✓ Saved';sb.disabled=true;});div.appendChild(sb);}
  chatMessages.appendChild(div);chatMessages.scrollTop=chatMessages.scrollHeight;
}
function appendMsgLive(text){
  const div=document.createElement('div');div.className='msg msg-ai';
  const lbl=document.createElement('div');lbl.className='msg-lbl';lbl.textContent='Assistant';
  const bub=document.createElement('div');bub.className='msg-bubble';bub.innerHTML=fmt(text);
  const sb=document.createElement('button');sb.className='msg-save';sb.textContent='+ Save to Notebook';
  div.appendChild(lbl);div.appendChild(bub);div.appendChild(sb);chatMessages.appendChild(div);chatMessages.scrollTop=chatMessages.scrollHeight;return sb;
}
function showTyping(){const d=document.createElement('div');d.className='msg msg-ai';d.id='typing-indicator';d.innerHTML=`<div class="msg-lbl">Assistant</div><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;chatMessages.appendChild(d);chatMessages.scrollTop=chatMessages.scrollHeight;}
function removeTyping(){$('typing-indicator')?.remove();}

async function sendMessage(){
  const text=chatInput.value.trim();if(!text||isAIThinking||!pdfDoc)return;
  // Chat only works when deployed on server, not local file
  if(window.location.protocol==='file:'){
    appendMsg('ai','**Chat only works on the deployed version.** Open the app at your Render URL (ladderreading.onrender.com) to use the AI assistant.',true);
    return;
  }
  chatInput.value='';chatInput.style.height='auto';isAIThinking=true;chatSend.disabled=true;chatStatus.textContent='Thinking…';
  appendMsg('user',text);pdfFullText=null;await buildPdfTextContext();
  const ch=chapters[activeChapter];
  const sys=`You are a friendly tutor helping a student understand their textbook. The student is on page ${currentPage} of chapter "${ch?.title}". Answer clearly using simple language and real-world examples. Keep answers concise.\n\nPAGE TEXT:\n${pdfFullText||''}`;
  const apiMsgs=conversationHistory.slice(-8).map(m=>({role:m.role,content:m.content}));apiMsgs.push({role:'user',content:text});
  showTyping();
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:800,system:sys,messages:apiMsgs})});
    const data=await res.json();removeTyping();if(data.error)throw new Error(data.error.message);
    const reply=data.content.find(b=>b.type==='text')?.text||'Sorry, no response.';
    conversationHistory.push({role:'user',content:text});conversationHistory.push({role:'assistant',content:reply});store.set(K.chat(bookId,activeChapter),conversationHistory);
    const sb=appendMsgLive(reply);sb.addEventListener('click',()=>{saveNote({type:'qa',question:text,answer:reply,chapterIdx:activeChapter,page:currentPage});sb.textContent='✓ Saved';sb.disabled=true;});
    chatStatus.textContent='Ready to help';if(!chatOpen)chatBadge.style.display='block';
  }catch(err){
    removeTyping();const d=document.createElement('div');d.className='msg msg-ai';d.innerHTML=`<div class="msg-lbl">Assistant</div><div class="msg-bubble">Error: ${esc(err.message)}</div>`;chatMessages.appendChild(d);chatStatus.textContent='Error — try again';
  }
  isAIThinking=false;chatSend.disabled=false;
}
function fmt(t){return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/`(.*?)`/g,'<code>$1</code>').replace(/\n/g,'<br>');}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
showScreen('library');renderLibraryGrid();
});
</script>
</body>
</html>
